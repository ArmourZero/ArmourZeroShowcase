<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="Resources/hmbct.png" />
    <link rel="stylesheet" href="Resources/button.css">
    <title>Vulnerable Web Application</title>
    <style>
        body {
            font-family: 'Inter', Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            animation: fadeIn 0.5s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .header {
            background: linear-gradient(180deg, #FF6962, #E55A54);
            padding: 20px;
            text-align: center;
            border-radius: 20px 20px 0 0;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
        }
        .header h1 {
            font-size: 32px;
            color: #fff;
            margin: 0;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .button-container {
            background-color: #FFB6B3;
            padding: 30px;
            text-align: center;
            border-radius: 0 0 20px 20px;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
            margin: 0 auto;
            width: 80%;
            max-width: 600px;
        }
        .button-container button {
            padding: 12px 24px;
            font-size: 16px;
            background-color: #FF6962;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            color: white;
            margin: 0 10px;
            font-weight: 500;
            transition: background-color 0.3s, transform 0.2s;
        }
        .button-container button:hover {
            background-color: #E55A54;
            transform: translateY(-2px);
        }
        @media (max-width: 600px) {
            .header h1 {
                font-size: 24px;
            }
            .button-container {
                width: 90%;
                padding: 20px;
            }
            .button-container button {
                display: block;
                width: 100%;
                margin: 10px 0;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Vulnerable Web Application</h1>
    </div>
    <div class="button-container">
        <button type="button" name="comexec_button" onclick="location.href='CommandExecution/CommandExec-2.php';">Command Execution</button>
        <button type="button" name="xss_button" onclick="location.href='XSS/XSS_level2.php';">XSS</button>
        <button type="button" name="secrets_button" onclick="location.href='Secrets/KeyExposure.php';">Secret Key Exposure</button>

    </div>
</body>
</html>
