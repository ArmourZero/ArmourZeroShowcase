<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="Resources/hmbct.png" />
    <title>ArmourZero Web Application (Vulnerable Mode)</title>
    <style>
      :root {
        /* Vulnerable Mode Colors (Red) */
        --primary: #ff9500;
        --secondary: #ff9100;
        --thirdary: #ff0000; /* Changed to red for vulnerable mode */
        --accent: #ff8c00;
        --text: #ffffff;
        --background: #afafaf;
      }

      /* Import Gotham Bold font */
      @font-face {
        font-family: "Gotham";
        src: url("path-to-your-fonts/Gotham-Bold.woff2") format("woff2");
        font-weight: 700;
        font-style: normal;
      }

      body {
        font-family: "Gotham", sans-serif;
        font-weight: 500; /* Apply bold weight */
        margin: 0;
        padding: 0;
        overflow: auto;
        color: var(--text);
        min-height: 100vh;
        transition: all 0.3s ease;
        background: linear-gradient(
          315deg,
          rgb(255, 136, 0) 3%,
          rgb(0, 0, 0) 98%
        );
        animation: gradient 13s ease infinite;
        background-size: 400% 400%;
        background-attachment: fixed;
      }

      @keyframes gradient {
        0% {
          background-position: 0% 0%;
        }
        50% {
          background-position: 100% 100%;
        }
        100% {
          background-position: 0% 0%;
        }
      }

      .wave {
        background: rgb(255 255 255 / 25%);
        border-radius: 1000% 1000% 0 0;
        position: fixed;
        width: 200%;
        height: 12em;
        animation: wave 10s -3s linear infinite;
        transform: translate3d(0, 0, 0);
        opacity: 0.8;
        bottom: 0;
        left: 0;
        z-index: -1;
      }

      .wave:nth-of-type(2) {
        bottom: -1.25em;
        animation: wave 18s linear reverse infinite;
        opacity: 0.8;
      }

      .wave:nth-of-type(3) {
        bottom: -2.5em;
        animation: wave 20s -1s reverse infinite;
        opacity: 0.9;
      }

      @keyframes wave {
        2% {
          transform: translateX(1);
        }
        25% {
          transform: translateX(-25%);
        }
        50% {
          transform: translateX(-50%);
        }
        75% {
          transform: translateX(-25%);
        }
        100% {
          transform: translateX(1);
        }
      }

      .container {
        max-width: 1000px;
        margin: 30px auto;
        position: relative;
      }

      /* Header grid layout for better zoom responsiveness */
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 20px;
        background: linear-gradient(
          180deg,
          rgba(0, 0, 0, 0.8),
          rgba(0, 0, 0, 0.9)
        );
        border-radius: 20px 20px 0 0;
        border-bottom: 2px solid var(--primary);
        gap: 15px;
      }

      .header-logo {
        height: 50px;
        width: 110px;
        margin-left: 16px;
      }

      .header-title {
        flex: 1;
        text-align: center;
        font-size: clamp(30px, 2vw, 24px);
        font-weight: 700;
        color: #fff;
      }

      .mode-display {
        font-weight: 700;
        text-align: center;
        background-color: var(--thirdary);
        color: #fff;
        padding: 6px 12px;
        border-radius: 6px;
        white-space: nowrap;
      }

      /* Button container with flex layout for 4 columns */
      .button-container {
        padding: 10px;
        background-color: rgba(30, 30, 30, 0.8);
        border-radius: 0 0 20px 20px;
        text-align: center;
        border: 1px solid #333;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
      }

      .action-button {
        padding: 6px 16px;
        background: linear-gradient(to bottom, var(--primary), var(--accent));
        color: #000;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        min-width: 160px;
        font-weight: 700;
        font-size: 18px;
        font-family: "Figtree", sans-serif;
        transition: all 0.3s ease;
        box-shadow: 0 0 10px var(--primary);
        flex: 1;
        max-width: 178px;
        margin: 10px;
      }

      .action-button:hover {
        transform: translateY(-3px);
        box-shadow: 0 0 20px var(--primary);
      }

      #content-display {
        max-width: 1000px;
        margin: 30px auto;
        background-color: rgba(26, 26, 26, 0.9);
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 0 10px #000;
        color: white;
        overflow-x: auto;
        font-family: "Figtree", sans-serif;
      }

      .warning-banner {
        background: var(--thirdary);
        color: white;
        text-align: center;
        padding: 10px;
        font-weight: 700;
        margin-bottom: 20px;
      }

      /* Improved responsive design */
      @media (max-width: 768px) {
        .header {
          grid-template-columns: auto 1fr auto;
          gap: 10px;
        }

        .header-logo {
          height: clamp(57px, 5vw, 50px);
        }

        .header h1 {
          font-size: clamp(18px, 5vw, 24px);
          margin-top: 8px;
          font-weight: 500;
        }
        .mode-display {
          max-width: 79px;
          height: 36px;
          font-size: 10px;
          padding: 0px 17px;
          line-height: 1.2;
          white-space: normal;
          place-content: center;
          font-weight: 1000;
        }

        .button-container {
          grid-template-columns: 1fr;
          gap: 10px;
          padding: 20px;
        }

        .action-button {
          width: 100%;
          margin: 0;
          padding: 14px 10px;
          font-size: 16px;
          min-height: 50px;
        }
      }

      /* Extreme zoom support */
      @media (max-width: 480px) {
        .header {
          flex-direction: column;
          align-items: flex-start;
        }

        .header-logo {
          height: 45px;
          width: 45px;
        }
        .header-title,
        .mode-display {
          text-align: left;
          width: 100%;
          margin-top: 5px;
        }

        .header-logo {
          margin-bottom: 5px;
        }

        .button-container {
          padding: 15px;
          gap: 8px;
        }

        .action-button {
          padding: 12px 8px;
          font-size: 13px;
          min-height: 45px;
        }
      }
    </style>
  </head>
  <body>
    <!-- Wave background elements -->
    <div>
      <div class="wave"></div>
      <div class="wave"></div>
      <div class="wave"></div>
    </div>

    <div class="container">
      <div class="header">
        <img
          src="armourzerologo.png"
          alt="ArmourZero Logo"
          class="header-logo"
        />
        <h1 class="header-title">ArmourZero Web Application</h1>
        <div class="mode-display" id="modeDisplay">VULNERABLE</div>
      </div>

      <!-- Button container with 2x2 grid layout -->
      <div class="button-container">
        <button
          class="action-button"
          onclick="loadContent('../Vulnerable-Web-Application-master/CommandExecution/CommandExec-2.php')"
        >
          Command Execution
        </button>
        <button
          class="action-button"
          onclick="loadContent('../Vulnerable-Web-Application-master/XSS/XSS_level2.php')"
        >
          XSS
        </button>
        <button
          class="action-button"
          onclick="loadContent('../Vulnerable-Web-Application-master/Secrets/KeyExposure.php')"
        >
          Secret Key Exposure
        </button>
        <button
          class="action-button"
          onclick="loadContent('../Vulnerable-Web-Application-master/SCA/SCAVuln.php')"
        >
          Vulnerable Dependency
        </button>
      </div>

      <!-- Content display area -->
      <div id="content-display">
        <!-- Loaded content will appear here -->
      </div>
    </div>

    <script>
      // Load PHP content dynamically
      function loadContent(url) {
        const container = document.getElementById("content-display");
        container.innerHTML = "<p style='text-align:center;'>Loading...</p>";

        fetch(url)
          .then((response) => {
            if (!response.ok)
              throw new Error("Failed to load vulnerable content");
            return response.text();
          })
          .then((data) => {
            container.innerHTML = data;
            attachFormHandlers();
          })
          .catch((error) => {
            container.innerHTML = `<p style="color:red; text-align:center;">${error}</p>`;
          });
      }

      // Handle form submissions without page refresh
      function attachFormHandlers() {
        const forms = document.querySelectorAll("#content-display form");
        forms.forEach((form) => {
          form.onsubmit = function (e) {
            e.preventDefault();
            const formData = new FormData(form);
            const url =
              form.action +
              (form.method.toUpperCase() === "GET"
                ? "?" + new URLSearchParams(formData).toString()
                : "");

            fetch(url, {
              method: form.method,
              body: form.method.toUpperCase() === "POST" ? formData : null,
            })
              .then((response) => response.text())
              .then((data) => {
                document.getElementById("content-display").innerHTML = data;
                attachFormHandlers(); // Reattach handlers for any new forms
              })
              .catch((error) => {
                document.getElementById(
                  "content-display"
                ).innerHTML = `<p style="color:red;">Vulnerability Error: ${error.message}</p>`;
              });
          };
        });
      }

      // Initialize form handlers when page loads
      document.addEventListener("DOMContentLoaded", function () {
        attachFormHandlers();
      });
    </script>
  </body>
</html>
