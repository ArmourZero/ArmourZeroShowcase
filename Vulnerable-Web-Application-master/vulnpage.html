<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="vulnpage.css" />
    <link
      rel="stylesheet"
      href="/Vulnerable-Web-Application-master/Components/component.css"
    />

    <link rel="shortcut icon" href="Resources/hmbct.png" />
    <title>ArmourZero Web Application (Vulnerable Mode)</title>
  </head>
  <body>
    <!-- Wave background elements -->
    <div>
      <div class="wave"></div>
      <div class="wave"></div>
      <div class="wave"></div>
    </div>

    <div class="container">
      <div class="header">
        <img
          src="armourzerologo.png"
          alt="ArmourZero Logo"
          class="header-logo"
        />
        <h1 class="header-title">ArmourZero Web Application</h1>
        <div class="mode-display" id="modeDisplay">VULNERABLE</div>
      </div>

      <!-- Button container with 2x2 grid layout -->
      <div class="button-container">
        <button
          class="action-button"
          onclick="loadContent('../Vulnerable-Web-Application-master/CommandExecution/CommandExec-2.php')"
        >
          Command Execution
        </button>
        <button
          class="action-button"
          onclick="loadContent('../Vulnerable-Web-Application-master/XSS/XSS_level2.php')"
        >
          XSS
        </button>
        <button
          class="action-button"
          onclick="loadContent('../Vulnerable-Web-Application-master/Secrets/KeyExposure.php')"
        >
          Secret Key Exposure
        </button>
        <button
          class="action-button"
          onclick="loadContent('../Vulnerable-Web-Application-master/SCA/SCAVuln.php')"
        >
          Vulnerable Dependency
        </button>
        <button
          class="action-button"
          onclick="loadContent('../Vulnerable-Web-Application-master/IaC/IaC_vuln.php')"
        >
          IaC Misconfiguration
        </button>
      </div>

      <!-- Content display area -->
      <div id="content-display">
        <!-- Loaded content will appear here -->
      </div>
    </div>

    <script>
      // Load PHP content dynamically
      function loadContent(url) {
        const container = document.getElementById("content-display");
        container.innerHTML = "<p style='text-align:center;'>Loading...</p>";

        fetch(url)
          .then((response) => {
            if (!response.ok)
              throw new Error("Failed to load vulnerable content");
            return response.text();
          })
          .then((data) => {
            container.innerHTML = data;
            attachFormHandlers();
          })
          .catch((error) => {
            container.innerHTML = `<p style="color:red; text-align:center;">${error}</p>`;
          });
      }

      // Handle form submissions without page refresh
      function attachFormHandlers() {
        const forms = document.querySelectorAll("#content-display form");
        forms.forEach((form) => {
          form.onsubmit = function (e) {
            e.preventDefault();
            const formData = new FormData(form);
            // detect clicked button
            const submitter = e.submitter;
            if (submitter && submitter.name) {
              formData.append(submitter.name, submitter.value || "1");
            }
            const url =
              form.action +
              (form.method.toUpperCase() === "GET"
                ? "?" + new URLSearchParams(formData).toString()
                : "");

            fetch(url, {
              method: form.method,
              body: form.method.toUpperCase() === "POST" ? formData : null,
            })
              .then((response) => response.text())
              .then((data) => {
                document.getElementById("content-display").innerHTML = data;
                attachFormHandlers(); // Reattach handlers for any new forms
              })
              .catch((error) => {
                document.getElementById(
                  "content-display"
                ).innerHTML = `<p style="color:red;">Vulnerability Error: ${error.message}</p>`;
              });
          };
        });
      }

      // Initialize form handlers when page loads
      document.addEventListener("DOMContentLoaded", function () {
        attachFormHandlers();
      });
    </script>
  </body>
</html>
